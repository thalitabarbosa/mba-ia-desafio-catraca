name: catraca

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: catraca
      POSTGRES_PASSWORD: catraca
      POSTGRES_DB: catraca
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U catraca -d catraca"]
      interval: 2s
      timeout: 3s
      retries: 30

  app:
    build:
      context: .
      target: runtime
    environment:
      DATABASE_URL: postgres://catraca:catraca@db:5432/catraca
      PORT: "3000"
      TZ: America/Sao_Paulo
      SESSION_SECRET: catraca-dev-session
      PARTNER_API_KEY: ${PARTNER_API_KEY:-catraca-parceiro-dev}
      GATEWAY_MODE: simulated
      GATEWAY_DELAY_SCALE: ${GATEWAY_DELAY_SCALE:-1}
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 2s
      timeout: 3s
      retries: 60
      start_period: 5s

volumes:
  dbdata:
